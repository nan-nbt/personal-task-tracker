image: repo.pouchen.com/docker-pcc-group/library/node:24.15.0-alpine

default:
  tags:
    - SGP-Test-K8s

stages:
  - test
  - build

cache:
  key:
    files:
      - package-lock.json
  paths:
    - .npm/

before_script:
  - npm ci --cache .npm --prefer-offline

test:
  stage: test
  script:
    - npm test

build:
  stage: build
  script:
    - npm run build
  artifacts:
    paths:
      - dist/
    expire_in: 1 week
